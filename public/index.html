<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Web Bridge</title>

  <link rel="stylesheet" href="vendor/xterm.min.css">
  <link rel="stylesheet" href="vendor/github-dark.min.css">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #1e1e1e;
    }
    #terminal-container {
      height: 100%;
      padding: 4px;
      overflow: hidden;
    }

    /* iOS Safari auto-zooms the page when focusing an input whose font-size
       is under 16px; the terminal's hidden textarea inherits 14px, which makes
       the page zoom/jump while typing (IME open) on iPhone/iPad. */
    .xterm .xterm-helper-textarea {
      font-size: 16px !important;
    }

    /* Connection status overlay */
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85);
      color: #e0e0e0;
      font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
      font-size: 16px;
      z-index: 100;
      transition: opacity 0.4s ease;
      user-select: none;
    }
    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #status-message {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #e0e0e0;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Reconnect button */
    #reconnect-btn {
      display: none;
      margin-top: 16px;
      padding: 8px 20px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      background: #2d2d2d;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
      transition: background 0.2s;
    }
    #reconnect-btn:hover {
      background: #3d3d3d;
    }

    .text-center { text-align: center; }

    /* Floating action buttons (mic + enter), bottom-right */
    .action-btn {
      position: fixed;
      bottom: 34px;
      z-index: 50;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      transition: background 0.2s, color 0.2s, transform 0.2s;
      outline: none;
      will-change: transform;
    }
    .action-btn:hover {
      background: rgba(255,255,255,0.2);
      color: #fff;
    }

    /* Mic button sits to the left of the enter button */
    .mic-btn { right: 128px; }
    .mic-btn.recording {
      background: rgba(220,50,50,0.25);
      color: #e04646;
      animation: mic-pulse 1.2s ease-in-out infinite;
    }
    .mic-btn.recording:hover {
      background: rgba(220,50,50,0.35);
    }
    @keyframes mic-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220,50,50,0.3); }
      50% { transform: scale(1.08); box-shadow: 0 0 0 8px rgba(220,50,50,0); }
    }

    /* Cancel button, between mic and enter */
    .cancel-btn { right: 76px; }
    .cancel-btn:hover,
    .cancel-btn:focus {
      background: rgba(220,50,50,0.2);
      color: #e04646;
    }
    .cancel-btn:active {
      transform: scale(0.92);
    }
    @media (hover: none) {
      .cancel-btn:hover {
        background: rgba(255,255,255,0.12);
        color: rgba(255,255,255,0.7);
      }
      .cancel-btn:active {
        background: rgba(220,50,50,0.25);
        color: #e04646;
        transform: scale(0.92);
      }
    }

    /* Enter / confirm button, rightmost */
    .enter-btn { right: 24px; }
    .enter-btn:hover,
    .enter-btn:focus {
      background: rgba(86,156,214,0.25);
      color: #569cd6;
    }
    .enter-btn:active {
      transform: scale(0.92);
    }
    /* Mobile: tap leaves a sticky :hover. Neutralize it on hover-less
       devices so the highlight doesn't linger after the tap is released. */
    @media (hover: none) {
      .enter-btn:hover {
        background: rgba(255,255,255,0.12);
        color: rgba(255,255,255,0.7);
      }
      .enter-btn:active {
        background: rgba(86,156,214,0.25);
        color: #569cd6;
        transform: scale(0.92);
      }
    }

    /* Voice input toast */
    .voice-toast {
      position: fixed;
      bottom: 76px;
      right: 76px;
      z-index: 49;
      max-width: 360px;
      padding: 8px 14px;
      border-radius: 6px;
      background: rgba(30,30,30,0.92);
      color: #d4d4d4;
      font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.5;
      pointer-events: none;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      word-break: break-all;
    }
    .voice-toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Arrow key row — replaces mic/enter when IME is visible */
    #arrow-row {
      position: fixed;
      right: 24px;
      bottom: 34px;
      z-index: 50;
      display: flex;
      gap: 8px;
    }
    #arrow-row.hidden {
      display: none;
    }
    .arrow-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: background 0.15s, color 0.15s, transform 0.15s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .arrow-btn:active {
      background: rgba(255,255,255,0.25);
      color: #fff;
      transform: scale(0.92);
    }
    @media (hover: hover) {
      .arrow-btn:hover {
        background: rgba(255,255,255,0.2);
        color: #fff;
      }
    }

    /* Hide action buttons when keyboard is visible */
    .action-btn-hidden {
      display: none !important;
    }

    /* ------------------------------------------------------------------ */
    /* File browser — folder toggle button (top-right)                     */
    /* ------------------------------------------------------------------ */
    #file-toggle {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 60;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.85);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 9px;
      transition: background 0.2s, color 0.2s, transform 0.15s;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    #file-toggle:hover {
      background: rgba(255,255,255,0.22);
      color: #fff;
    }
    #file-toggle:active {
      transform: scale(0.92);
    }

    /* ------------------------------------------------------------------ */
    /* File browser — right slide-in panel                                 */
    /* ------------------------------------------------------------------ */
    .file-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 70;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .file-backdrop.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #file-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 80;
      width: min(340px, 88vw);
      background: #1e1e1e;
      border-left: 1px solid #3c3c3c;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.28s ease;
      box-shadow: -8px 0 24px rgba(0,0,0,0.4);
    }
    #file-panel.visible {
      transform: translateX(0);
    }

    .file-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid #333;
      background: #252526;
      flex-shrink: 0;
    }
    .file-bar .file-close {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.8);
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .file-bar .file-close:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }
    #file-breadcrumb {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: #d4d4d4;
      font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 2px;
      min-width: 0;
    }
    #file-breadcrumb .crumb {
      cursor: pointer;
      color: #569cd6;
      padding: 1px 3px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    #file-breadcrumb .crumb:hover {
      background: rgba(255,255,255,0.1);
    }
    #file-breadcrumb .crumb-sep {
      color: #808080;
      flex-shrink: 0;
    }
    #file-breadcrumb .crumb-current {
      color: #d4d4d4;
      cursor: default;
    }

    #file-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }
    .file-entry {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      cursor: pointer;
      color: #d4d4d4;
      font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      user-select: none;
      white-space: nowrap;
    }
    .file-entry:hover {
      background: rgba(255,255,255,0.07);
    }
    .file-entry .fe-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: #808080;
    }
    .file-entry.dir .fe-icon {
      color: #d7ba7d;
    }
    .file-entry .fe-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-entry .fe-size {
      color: #6a9955;
      font-size: 11px;
      flex-shrink: 0;
    }
    .file-entry.up {
      color: #569cd6;
    }

    #file-error {
      padding: 16px 12px;
      color: #808080;
      font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
      font-size: 13px;
    }
    #file-error { color: #f48771; }

    /* ------------------------------------------------------------------ */
    /* File viewer — full-screen overlay, does not affect main layout      */
    /* ------------------------------------------------------------------ */
    #file-viewer {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(14px) scale(0.98);
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    #file-viewer.visible {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }
    #file-viewer .file-bar {
      padding: 6px 10px;
    }
    #file-viewer .file-bar .file-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #d4d4d4;
      font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
      font-size: 13px;
    }
    #file-viewer .file-bar .file-badge {
      flex-shrink: 0;
      font-size: 11px;
      color: #808080;
      background: rgba(255,255,255,0.08);
      padding: 2px 8px;
      border-radius: 10px;
      font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
    }
    #file-viewer pre {
      flex: 1;
      margin: 0;
      padding: 12px 16px;
      overflow: auto;
      font-family: 'Menlo', 'Consolas', 'DejaVu Sans Mono', monospace;
      font-size: 13px;
      line-height: 1.5;
      tab-size: 2;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    #file-viewer pre code {
      background: transparent;
      font-family: inherit;
      padding: 0;
      white-space: pre;
    }
    #file-viewer .viewer-note {
      flex-shrink: 0;
      padding: 10px 16px;
      color: #f48771;
      font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      background: rgba(244,135,113,0.08);
      border-top: 1px solid #333;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <div class="text-center">
      <div id="status-message">
        <span class="spinner"></span>
        <span id="status-text">Connecting...</span>
      </div>
      <button id="reconnect-btn">Reconnect</button>
    </div>
  </div>

  <div id="terminal-container"></div>

  <div id="voice-toast" class="voice-toast"></div>

  <button id="file-toggle" type="button" title="文件浏览器" aria-label="文件浏览器">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
      <line x1="3" y1="11" x2="21" y2="11"/>
    </svg>
  </button>

  <div id="file-backdrop" class="file-backdrop"></div>

  <div id="file-panel">
    <div class="file-bar">
      <button id="file-panel-close" class="file-close" type="button" title="关闭 (Esc)" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <div id="file-breadcrumb"></div>
    </div>
    <div id="file-list"></div>
    <div id="file-error" style="display:none"></div>
  </div>

  <div id="file-viewer">
    <div class="file-bar">
      <button id="file-viewer-close" class="file-close" type="button" title="关闭 (Esc)" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <div id="file-viewer-title" class="file-title"></div>
      <span id="file-viewer-badge" class="file-badge"></span>
    </div>
    <pre><code id="file-viewer-code"></code></pre>
    <div id="file-viewer-note" class="viewer-note" style="display:none"></div>
  </div>

  <button id="mic-btn" class="action-btn mic-btn" type="button" title="语音输入" aria-label="语音输入">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="22"/>
    </svg>
  </button>

  <button id="cancel-btn" class="action-btn cancel-btn" type="button" tabindex="-1" title="取消 (Esc)" aria-label="取消 (Esc)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>

  <button id="enter-btn" class="action-btn enter-btn" type="button" tabindex="-1" title="确认 (Enter)" aria-label="确认 (Enter)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 10 4 15 9 20"/>
      <path d="M20 4v7a4 4 0 0 1-4 4H4"/>
    </svg>
  </button>

  <div id="arrow-row" class="hidden">
    <button class="arrow-btn" data-dir="left"  tabindex="-1" aria-label="左">←</button>
    <button class="arrow-btn" data-dir="up"    tabindex="-1" aria-label="上">↑</button>
    <button class="arrow-btn" data-dir="down"  tabindex="-1" aria-label="下">↓</button>
    <button class="arrow-btn" data-dir="right" tabindex="-1" aria-label="右">→</button>
  </div>

  <script src="vendor/xterm.min.js"></script>
  <script src="vendor/xterm-addon-fit.min.js"></script>
  <script src="vendor/xterm-addon-web-links.min.js"></script>
  <script src="vendor/xterm-addon-canvas.min.js"></script>
  <script src="vendor/highlight.min.js"></script>


  <script>
    (function () {
      'use strict';

      const container  = document.getElementById('terminal-container');
      const overlay    = document.getElementById('overlay');
      const statusText = document.getElementById('status-text');
      const statusMsg  = document.getElementById('status-message');
      const reconnectBtn = document.getElementById('reconnect-btn');

      const term = new Terminal({
        cursorBlink: true,
        cursorStyle: 'block',
        fontSize: 14,
        fontFamily: '"Menlo", "Consolas", "DejaVu Sans Mono", "Courier New", monospace',
        allowTransparency: false,
        theme: {
          background: '#1e1e1e',
          foreground: '#d4d4d4',
          cursor: '#d4d4d4',
          selectionBackground: '#264f78',
          black: '#252526',
          red: '#f44747',
          green: '#6a9955',
          yellow: '#d7ba7d',
          blue: '#569cd6',
          magenta: '#c586c0',
          cyan: '#4ec9b0',
          white: '#d4d4d4',
          brightBlack: '#808080',
          brightRed: '#f44747',
          brightGreen: '#6a9955',
          brightYellow: '#d7ba7d',
          brightBlue: '#569cd6',
          brightMagenta: '#c586c0',
          brightCyan: '#4ec9b0',
          brightWhite: '#d4d4d4',
        },
      });

      const fitAddon = new FitAddon.FitAddon();
      const webLinksAddon = new WebLinksAddon.WebLinksAddon();
      const canvasAddon = new CanvasAddon.CanvasAddon();
      term.loadAddon(fitAddon);
      term.loadAddon(webLinksAddon);
      term.loadAddon(canvasAddon);

      term.open(container);

      // -------------------------------------------------------------------
      // Overlay helpers
      // -------------------------------------------------------------------
      function showOverlay(showSpinner, message, showReconnect) {
        overlay.classList.remove('hidden');
        statusText.textContent = message || '';
        var spinnerEl = statusMsg.querySelector('.spinner');
        if (spinnerEl) {
          spinnerEl.style.display = showSpinner ? 'inline-block' : 'none';
        }
        reconnectBtn.style.display = showReconnect ? 'inline-block' : 'none';
      }

      function hideOverlay() {
        overlay.classList.add('hidden');
        reconnectBtn.style.display = 'none';
      }

      // -------------------------------------------------------------------
      // Resize handling (debounced).
      // Skipped while the IME is composing: the IME candidate window often
      // fires resize events, and letting them re-fit the PTY mid-composition
      // makes the agent re-render the whole screen (page jumping/flickering).
      // -------------------------------------------------------------------
      var resizeTimer = null;
      var isComposing = false;
      var lastCols = 0;
      var lastRows = 0;

      function sendResize() {
        var dims;
        try {
          dims = fitAddon.proposeDimensions();
          if (!dims) return;
          if (dims.cols === lastCols && dims.rows === lastRows) return;
          lastCols = dims.cols;
          lastRows = dims.rows;
          fitAddon.fit();
        } catch (_) {
          return;
        }
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'resize',
            cols: dims.cols,
            rows: dims.rows,
          }));
        }
      }

      function debouncedResize() {
        if (resizeTimer) clearTimeout(resizeTimer);
        if (isComposing) return;
        resizeTimer = setTimeout(sendResize, 120);
      }

      window.addEventListener('resize', debouncedResize);

      if (window.ResizeObserver) {
        var ro = new ResizeObserver(function () { debouncedResize(); });
        ro.observe(container);
      }

      // Don't re-layout the terminal mid-composition; re-fit once after the
      // IME commits (or cancels) so any real size change is picked up.
      document.addEventListener('compositionstart', function () {
        isComposing = true;
      });
      document.addEventListener('compositionend', function () {
        isComposing = false;
        debouncedResize();
      });

      // -------------------------------------------------------------------
      // WebSocket connection
      // -------------------------------------------------------------------
      var ws = null;
      var reconnectTimer = null;
      var intentionalClose = false;
      var reconnectAttempts = 0;
      var MAX_RECONNECT_DELAY = 15000;

      function getReconnectDelay() {
        var delay = Math.min(1000 * Math.pow(2, reconnectAttempts), MAX_RECONNECT_DELAY);
        reconnectAttempts++;
        return delay;
      }

      function scheduleReconnect() {
        if (reconnectTimer) clearTimeout(reconnectTimer);
        var delay = getReconnectDelay();
        reconnectTimer = setTimeout(function () { connect(); }, delay);
      }

      function cancelReconnect() {
        if (reconnectTimer) {
          clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }
        reconnectAttempts = 0;
      }

      function connect() {
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
          return;
        }

        intentionalClose = false;
        showOverlay(true, 'Connecting...', false);

        var token = new URL(window.location.href).searchParams.get('token') || '';
        var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        var wsUrl = protocol + '//' + window.location.host + (token ? '?token=' + encodeURIComponent(token) : '');

        ws = new WebSocket(wsUrl);

        ws.onopen = function () {
          cancelReconnect();
          lastCols = 0;
          lastRows = 0;
          sendResize();
        };

        ws.onmessage = function (event) {
          var msg;
          try {
            msg = JSON.parse(event.data);
          } catch (e) {
            term.write(event.data);
            return;
          }

          switch (msg.type) {
            case 'data':
              hideOverlay();
              term.write(msg.data);
              break;

            case 'exit':
              showOverlay(
                false,
                'Claude exited (code: ' + msg.code +
                  (msg.signal ? ', signal: ' + msg.signal : '') + ').' +
                  ' The session has ended. Close this tab or open a new one to restart.',
                true
              );
              break;

            case 'error':
              console.error('[ws] Server error:', msg.message);
              showOverlay(false, 'Error: ' + msg.message, true);
              break;

            default:
              console.log('[ws] Unknown message type:', msg.type);
          }
        };

        ws.onclose = function () {
          console.log('[ws] Closed');
          ws = null;
          if (!intentionalClose) {
            showOverlay(true, 'Connection lost. Reconnecting...', false);
            scheduleReconnect();
          }
        };

        ws.onerror = function () {
          console.error('[ws] Error');
        };
      }

      // -------------------------------------------------------------------
      // Manual reconnect button
      // -------------------------------------------------------------------
      reconnectBtn.addEventListener('click', function () {
        cancelReconnect();
        connect();
      });

      // -------------------------------------------------------------------
      // Terminal -> WebSocket: user input
      // -------------------------------------------------------------------
      term.onData(function (data) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'input', data: data }));
        }
      });

      // -------------------------------------------------------------------
      // Click on terminal container focuses terminal
      // -------------------------------------------------------------------
      container.addEventListener('click', function () {
        term.focus();
      });

      // -------------------------------------------------------------------
      // Web Speech API — voice input
      // -------------------------------------------------------------------
      var micBtn = document.getElementById('mic-btn');
      var voiceToast = document.getElementById('voice-toast');
      var recognition = null;
      var isRecording = false;
      var idleTimer = null;
      var pendingStart = null;
      var toastTimer = null;
      var IDLE_TIMEOUT = 15000;

      function showVoiceToast(text) {
        if (toastTimer) clearTimeout(toastTimer);
        voiceToast.textContent = '🎤 ' + text;
        voiceToast.classList.add('visible');
        toastTimer = setTimeout(function () {
          voiceToast.classList.remove('visible');
          toastTimer = null;
        }, 2000);
      }

      function stopRecording() {
        isRecording = false;
        if (pendingStart) { clearTimeout(pendingStart); pendingStart = null; }
        if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
        if (micBtn) micBtn.classList.remove('recording');
        if (recognition) {
          try { recognition.stop(); } catch (_) {}
        }
      }

      function startRecording() {
        var RecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!RecognitionCtor) {
          alert('浏览器不支持语音识别，请使用 Chrome/Edge 等基于 Chromium 的浏览器。');
          return;
        }

        if (recognition) { try { recognition.abort(); } catch (_) {} }

        var r = new RecognitionCtor();
        recognition = r;
        r.continuous = true;
        r.interimResults = false;
        r.lang = 'zh-CN';

        function resetIdleTimer() {
          if (idleTimer) clearTimeout(idleTimer);
          idleTimer = setTimeout(stopRecording, IDLE_TIMEOUT);
        }

        r.onresult = function (event) {
          resetIdleTimer();
          var transcript = '';
          for (var i = event.resultIndex; i < event.results.length; i++) {
            if (event.results[i].isFinal) {
              transcript += event.results[i][0].transcript;
            }
          }
          if (transcript) {
            showVoiceToast(transcript);
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: 'input', data: transcript }));
            }
          }
        };

        r.onerror = function (event) {
          if (event.error === 'no-speech' || event.error === 'aborted') return;
          stopRecording();
        };

        r.onend = function () {
          if (r === recognition) recognition = null;
          if (isRecording) {
            try { r.start(); recognition = r; } catch (_) { stopRecording(); }
          }
        };

        try {
          r.start();
          isRecording = true;
          micBtn.classList.add('recording');
          resetIdleTimer();
        } catch (e) {
          stopRecording();
          alert('语音启动失败：' + e.message + '\n\n请确保：\n1. 使用 HTTPS 或 localhost 访问\n2. 已授予麦克风权限');
        }
      }

      function beginPress() {
        if (pendingStart) return;
        pendingStart = setTimeout(function () {
          pendingStart = null;
          startRecording();
        }, 300);
      }

      function endPress() {
        if (pendingStart) {
          clearTimeout(pendingStart);
          pendingStart = null;
          return;
        }
        stopRecording();
      }

      if (micBtn) {
        micBtn.addEventListener('mousedown', function (e) {
          e.preventDefault();
          beginPress();
        });
        micBtn.addEventListener('mouseup', endPress);
        micBtn.addEventListener('mouseleave', endPress);

        micBtn.addEventListener('touchstart', function (e) {
          e.preventDefault();
          beginPress();
        });
        micBtn.addEventListener('touchend', endPress);
        micBtn.addEventListener('touchcancel', endPress);
      }

      // -------------------------------------------------------------------
      // Enter / confirm button — submit the current prompt line to the PTY.
      // preventDefault on mousedown stops the click from stealing focus and
      // refocusing xterm's hidden <textarea>, which would otherwise pop up
      // the IME / soft keyboard right after sending Enter.
      // -------------------------------------------------------------------
      var enterBtn = document.getElementById('enter-btn');
      if (enterBtn) {
        enterBtn.addEventListener('mousedown', function (e) {
          e.preventDefault();
        });
        enterBtn.addEventListener('click', function () {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'input', data: '\r' }));
          }
        });
      }

      // -------------------------------------------------------------------
      // Cancel button — send ESC
      // -------------------------------------------------------------------
      var cancelBtn = document.getElementById('cancel-btn');
      if (cancelBtn) {
        cancelBtn.addEventListener('mousedown', function (e) {
          e.preventDefault();
        });
        cancelBtn.addEventListener('click', function () {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'input', data: '\x1b' }));
          }
        });
      }

      // -------------------------------------------------------------------
      // Arrow key row — shown when IME/soft keyboard is open on touch devices
      // Detect keyboard via xterm's hidden textarea focus.
      // -------------------------------------------------------------------
      var arrowRow = document.getElementById('arrow-row');
      var isTouchDevice = 'ontouchend' in window;
      var isSmallScreen = window.innerWidth < 768;

      function isMobileKeyboard() {
        return isTouchDevice && isSmallScreen;
      }

      function updateKeyboardUI(visible) {
        if (visible && isMobileKeyboard()) {
          micBtn && micBtn.classList.add('action-btn-hidden');
          cancelBtn && cancelBtn.classList.add('action-btn-hidden');
          enterBtn && enterBtn.classList.add('action-btn-hidden');
          arrowRow.classList.remove('hidden');
        } else {
          micBtn && micBtn.classList.remove('action-btn-hidden');
          cancelBtn && cancelBtn.classList.remove('action-btn-hidden');
          enterBtn && enterBtn.classList.remove('action-btn-hidden');
          arrowRow.classList.add('hidden');
        }
      }

      // Detect keyboard via visualViewport height changes
      if (window.visualViewport) {
        var detectKeyboard = function () {
          var diff = window.innerHeight - window.visualViewport.height;
          var isOpen = diff > 150;
          updateKeyboardUI(isOpen);
          if (isOpen) {
            requestAnimationFrame(function () {
              window.scrollTo(0, document.body.scrollHeight);
            });
          }
        };
        window.visualViewport.addEventListener('resize', detectKeyboard);
      }

      // Arrow key sequences
      var ARROW_SEQ = {
        left:  '\x1b[D',
        right: '\x1b[C',
        up:    '\x1b[A',
        down:  '\x1b[B',
      };

      // preventDefault on mousedown stops focus stealing
      arrowRow.addEventListener('mousedown', function (e) {
        var btn = e.target.closest('.arrow-btn');
        if (btn) e.preventDefault();
      });

      arrowRow.addEventListener('click', function (e) {
        var btn = e.target.closest('.arrow-btn');
        if (!btn) return;
        var dir = btn.getAttribute('data-dir');
        var seq = ARROW_SEQ[dir];
        if (seq && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'input', data: seq }));
          term.focus();
        }
      });

      // On screen resize, re-check if we're on a small screen
      window.addEventListener('resize', function () {
        isSmallScreen = window.innerWidth < 768;
        if (!isMobileKeyboard()) {
          updateKeyboardUI(false);
        }
      });

      // -------------------------------------------------------------------
      // Prevent accidental browser tab close on Ctrl+N/W/T
      // -------------------------------------------------------------------
      container.addEventListener('keydown', function (e) {
        if (
          (e.ctrlKey && ['n', 'w', 't'].includes(e.key.toLowerCase())) ||
          e.key === 'F5' ||
          (e.ctrlKey && e.key === 'F5')
        ) {
          e.preventDefault();
        }
      });

      // -------------------------------------------------------------------
      // File browser — right slide-in panel + read-only viewer
      // -------------------------------------------------------------------
      var fileToggle  = document.getElementById('file-toggle');
      var fileBackdrop = document.getElementById('file-backdrop');
      var filePanel   = document.getElementById('file-panel');
      var fileList    = document.getElementById('file-list');
      var fileBreadcrumb = document.getElementById('file-breadcrumb');
      var fileError   = document.getElementById('file-error');
      var fileViewer  = document.getElementById('file-viewer');
      var viewerCode  = document.getElementById('file-viewer-code');
      var viewerTitle = document.getElementById('file-viewer-title');
      var viewerBadge = document.getElementById('file-viewer-badge');
      var viewerNote  = document.getElementById('file-viewer-note');

      var authToken = new URL(window.location.href).searchParams.get('token') || '';

      function apiUrl(path, rel) {
        var u = '/api' + path + '?rel=' + encodeURIComponent(rel || '');
        if (authToken) u += '&token=' + encodeURIComponent(authToken);
        return u;
      }

      function fmtSize(n) {
        if (n < 1024) return n + ' B';
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
        return (n / (1024 * 1024)).toFixed(1) + ' MB';
      }

      function renderBreadcrumb(rel) {
        fileBreadcrumb.innerHTML = '';
        var parts = (rel && rel !== '.') ? rel.split(/[\\/]/) : [];
        var acc = '';
        var root = document.createElement('span');
        root.className = 'crumb';
        root.textContent = '\u2302';
        root.title = '根目录';
        root.addEventListener('click', function () { loadDir(''); });
        fileBreadcrumb.appendChild(root);
        for (var i = 0; i < parts.length; i++) {
          var sep = document.createElement('span');
          sep.className = 'crumb-sep';
          sep.textContent = '/';
          fileBreadcrumb.appendChild(sep);
          acc = acc ? acc + '/' + parts[i] : parts[i];
          var crumb = document.createElement('span');
          crumb.className = 'crumb' + (i === parts.length - 1 ? ' crumb-current' : '');
          crumb.textContent = parts[i];
          if (i < parts.length - 1) {
            (function (r) {
              crumb.addEventListener('click', function () { loadDir(r); });
            })(acc);
          }
          fileBreadcrumb.appendChild(crumb);
        }
      }

      function setPanelMessage(msg, isError) {
        fileList.innerHTML = '';
        fileError.style.display = msg ? 'block' : 'none';
        fileError.textContent = msg || '';
        fileError.style.color = isError ? '#f48771' : '#808080';
      }

      function loadDir(rel) {
        renderBreadcrumb(rel || '');
        setPanelMessage('加载中...', false);
        fetch(apiUrl('/list', rel))
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data.error) { setPanelMessage(data.error, true); return; }
            fileError.style.display = 'none';
            fileList.innerHTML = '';
            if (data.cwd && data.cwd !== '.') {
              var up = document.createElement('div');
              up.className = 'file-entry up';
              up.innerHTML = '\u2191 .. 返回上级';
              up.addEventListener('click', function () {
                var p = (data.cwd || '').split(/[\\/]/);
                p.pop();
                loadDir(p.join('/'));
              });
              fileList.appendChild(up);
            }
            if (!data.entries.length) {
              setPanelMessage('\uff08空目录\uff09', false);
              return;
            }
            data.entries.forEach(function (e) {
              var row = document.createElement('div');
              row.className = 'file-entry' + (e.isDir ? ' dir' : '');
              var icon = e.isDir
                ? '<svg class="fe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>'
                : '<svg class="fe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
              row.innerHTML = icon +
                '<span class="fe-name"></span>' +
                (e.isDir ? '' : '<span class="fe-size">' + fmtSize(e.size) + '</span>');
              row.querySelector('.fe-name').textContent = e.name;
              row.addEventListener('click', function () {
                if (e.isDir) loadDir(e.rel);
                else openViewer(e);
              });
              fileList.appendChild(row);
            });
          })
          .catch(function (err) {
            setPanelMessage('加载失败：' + err.message, true);
          });
      }

      function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      var HIGHLIGHT_EXT = {
        'js': 'javascript', 'mjs': 'javascript', 'cjs': 'javascript', 'jsx': 'javascript',
        'ts': 'typescript', 'tsx': 'typescript', 'mts': 'typescript',
        'py': 'python', 'rb': 'ruby', 'go': 'go', 'rs': 'rust', 'java': 'java',
        'c': 'c', 'h': 'c', 'cpp': 'cpp', 'cc': 'cpp', 'hpp': 'cpp',
        'cs': 'csharp', 'php': 'php', 'swift': 'swift', 'kt': 'kotlin',
        'sh': 'bash', 'bash': 'bash', 'zsh': 'bash', 'ps1': 'powershell',
        'json': 'json', 'html': 'xml', 'htm': 'xml', 'xml': 'xml', 'svg': 'xml',
        'css': 'css', 'scss': 'scss', 'less': 'less',
        'md': 'markdown', 'markdown': 'markdown', 'yml': 'yaml', 'yaml': 'yaml',
        'sql': 'sql', 'toml': 'ini', 'ini': 'ini', 'conf': 'ini',
        'txt': '', 'text': '', 'log': '',
      };

      function langFor(name) {
        var dot = name.lastIndexOf('.');
        if (dot < 0) return '';
        return HIGHLIGHT_EXT[name.slice(dot + 1).toLowerCase()] || '';
      }

      function openViewer(entry) {
        viewerTitle.textContent = entry.rel;
        viewerBadge.textContent = fmtSize(entry.size);
        viewerNote.style.display = 'none';
        viewerCode.textContent = '';
        viewerCode.className = '';
        fileViewer.classList.add('visible');

        fetch(apiUrl('/file', entry.rel))
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data.error) {
              viewerNote.style.display = 'block';
              viewerNote.textContent = '读取失败：' + data.error;
              return;
            }
            if (data.binary) {
              viewerNote.style.display = 'block';
              viewerNote.textContent = '\u26a0 二进制文件，无法以文本方式预览。';
              return;
            }
            var lang = langFor(data.name);
            var html;
            if (lang && window.hljs && hljs.getLanguage(lang)) {
              try {
                html = hljs.highlight(data.content, { language: lang, ignoreIllegals: true }).value;
                viewerCode.className = 'hljs language-' + lang;
              } catch (_) {
                html = escapeHtml(data.content);
              }
            } else {
              html = escapeHtml(data.content);
            }
            viewerCode.innerHTML = html;
            if (data.truncated) {
              viewerNote.style.display = 'block';
              viewerNote.textContent = '\u26a0 文件过大，仅显示前 ' + fmtSize(1024 * 1024) + '。';
            }
          })
          .catch(function (err) {
            viewerNote.style.display = 'block';
            viewerNote.textContent = '读取失败：' + err.message;
          });
      }

      function closeViewer() {
        fileViewer.classList.remove('visible');
        viewerCode.textContent = '';
        viewerNote.style.display = 'none';
      }

      function openPanel() {
        filePanel.classList.add('visible');
        fileBackdrop.classList.add('visible');
        loadDir('');
      }

      function closePanel() {
        filePanel.classList.remove('visible');
        fileBackdrop.classList.remove('visible');
      }

      fileToggle.addEventListener('click', function () {
        if (filePanel.classList.contains('visible')) closePanel();
        else openPanel();
      });
      document.getElementById('file-panel-close').addEventListener('click', closePanel);
      document.getElementById('file-viewer-close').addEventListener('click', closeViewer);
      fileBackdrop.addEventListener('click', function () {
        if (fileViewer.classList.contains('visible')) closeViewer();
        else closePanel();
      });

      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        if (fileViewer.classList.contains('visible')) {
          closeViewer();
          e.preventDefault();
        } else if (filePanel.classList.contains('visible')) {
          closePanel();
          e.preventDefault();
        }
      });

      // -------------------------------------------------------------------
      // Cleanup on page unload
      // -------------------------------------------------------------------
      window.addEventListener('beforeunload', function () {
        if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
        stopRecording();
        intentionalClose = true;
        cancelReconnect();
        if (ws) {
          ws.close();
          ws = null;
        }
      });

      // -------------------------------------------------------------------
      // Initial connection
      // -------------------------------------------------------------------
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          try { fitAddon.fit(); } catch (_) { /* ignore layout glitches */ }
          connect();
        });
      });

    })();
  </script>
</body>
</html>
